name: Daily refresh (Search Console)

on:
  schedule:
    - cron: "17 13 * * *"   # ~7am Mountain
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # keyless Google sign-in (Workload Identity Federation)

concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sign in to Google (keyless)
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run daily jobs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python -m seo.run daily || echo "JOB_FAILED=1" >> "$GITHUB_ENV"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          # Another run may have pushed first. Retry, keeping this run's data files on conflict.
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

      - name: Report failure
        if: env.JOB_FAILED == '1'
        run: |
          echo "::error::One or more jobs failed. See the Setup tab on the dashboard for details."
          exit 1
