name: Weekly refresh (audit, rankings, AI visibility, recommendations)

on:
  schedule:
    - cron: "23 12 * * 1"   # Mondays ~6am Mountain
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run (weekly, or any of: gsc audit ranks ai_visibility opportunities tips)"
        default: weekly
        required: false

permissions:
  contents: write
  id-token: write   # keyless Google sign-in (Workload Identity Federation)

concurrency:
  group: seo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sign in to Google (keyless)
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run jobs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOBS: ${{ github.event.inputs.jobs || 'weekly' }}
        run: python -m seo.run $JOBS || echo "JOB_FAILED=1" >> "$GITHUB_ENV"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: weekly refresh $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Report failure
        if: env.JOB_FAILED == '1'
        run: |
          echo "::error::One or more jobs failed. See the Setup tab on the dashboard for details."
          exit 1
